# 商品点餐系统 · 腾讯云 CVM 裸机 Nginx 反代配置
# 用法：放到 /etc/nginx/conf.d/order.conf 后 `nginx -t && systemctl reload nginx`
# 作用：把公网 80/443 的 /api 请求转发到本机 3000 端口的后端。
# 微信/支付宝异步回调走 /api/pay/*，已包含在 /api 反代内，因此回调天然公网可达。

server {
    listen 80;
    # 改成你的域名；仅用 IP 访问可保留 _ 或填 CVM 公网 IP
    server_name _;

    # 若部署 Web(H5) 端，解开下面块并把 build 目录放好
    # location / {
    #     root /opt/order-system/customer_app/build/web;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    # 后端 API 反代（顾客端 APP / 收银端 / 支付回调 都走这里）
    location /api {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 健康检查（可选）
    location /healthz {
        proxy_pass http://127.0.0.1:3000/api/menu;
    }
}
